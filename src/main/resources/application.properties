# Application Configuration
spring.application.name=SmartTask

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smarttask_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Server Configuration
server.port=8080

# Initial Super Admin Configuration
app.super-admin.name=${SUPER_ADMIN_NAME:Super Admin}
app.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:}